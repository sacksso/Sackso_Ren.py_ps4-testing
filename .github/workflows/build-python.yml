name: Build Python (PS4)

# PASO 3: cross-compilar CPython como libreria ESTATICA (libpython3.x.a) con el toolchain OpenOrbis.
# Es un intento de RECONOCIMIENTO: es muy probable que la primera vez falten funciones de libc o que
# configure proteste. Por eso siempre sube el artefacto 'logs-python' (configure.log, make.log y
# missing.txt = lista de funciones que configure NO encontro en la libc de la PS4). Pasamelos y iteramos.
#
# Colocar en: .github/workflows/build-python.yml
#
# INTERRUPTORES:
#   toolchain_tag   Tag del release de OpenOrbis (latest = el ultimo).
#   python_version  Version exacta de CPython (debe existir en python.org). Ren'Py 8.x usa Python 3.12.
#   jobs            Hilos de make.

on:
  workflow_dispatch:
    inputs:
      toolchain_tag:
        description: 'Tag del release de OpenOrbis (latest = el ultimo)'
        type: string
        default: 'latest'
      python_version:
        description: 'Version de CPython (ej. 3.12.10)'
        type: string
        default: '3.12.10'
      jobs:
        description: 'Hilos de make'
        type: string
        default: '4'
      socket:
        description: 'Incluir modulo _socket (true/false). Poner false si falla el enlace por simbolos de red'
        type: string
        default: 'true'

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  python:
    name: CPython estatico para PS4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Dependencias
        run: |
          mkdir -p logs-python
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm make zip unzip python3.12 pkg-config
          { clang --version | head -1; llvm-ar --version | head -1; python3.12 --version; } 2>&1 | tee logs-python/versions.txt

      - name: Instalar libssl1.1 para PkgTool.Core
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ok=0
          for u in \
            "http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb" \
            "http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb"; do
            if wget -q "$u" -O libssl1.1.deb; then ok=1; echo "Descargado: $u"; break; fi
          done
          [ "$ok" = 1 ] || { echo "::error::No pude descargar libssl1.1"; exit 1; }
          sudo dpkg -i libssl1.1.deb
          ldconfig -p | grep -E 'libssl\.so' | tee "$GITHUB_WORKSPACE/logs-python/libssl.txt"
          echo "CLR_OPENSSL_VERSION_OVERRIDE=1.1" >> "$GITHUB_ENV"

      - name: Descargar el toolchain de OpenOrbis
        env:
          TAG: ${{ inputs.toolchain_tag }}
        run: |
          set -euo pipefail
          repo=OpenOrbis/OpenOrbis-PS4-Toolchain
          if [ "$TAG" = "latest" ]; then ep="repos/$repo/releases/latest"; else ep="repos/$repo/releases/tags/$TAG"; fi
          gh api "$ep" > release.json
          tag=$(jq -r .tag_name release.json)
          asset=$(jq -r '[.assets[].name | select(test("linux";"i")) | select(test("\\.(tar\\.gz|tgz|zip)$";"i"))][0] // empty' release.json)
          if [ -z "$asset" ]; then
            asset=$(jq -r '[.assets[].name | select(test("\\.(tar\\.gz|tgz|zip)$";"i")) | select(test("windows|macos|win|mac|installer";"i") | not)][0] // empty' release.json)
          fi
          [ -n "$asset" ] || { echo "::error::No encontre asset de toolchain"; exit 1; }
          echo "Release $tag, asset $asset"
          gh release download "$tag" --repo "$repo" --pattern "$asset" --dir dl
          mkdir -p "$HOME/oo"
          case "$asset" in
            *.zip) unzip -q "dl/$asset" -d "$HOME/oo" ;;
            *)     tar -xf "dl/$asset" -C "$HOME/oo" ;;
          esac
          bl=$(find "$HOME/oo" -type d -path '*/bin/linux' | head -1)
          root=$(dirname "$(dirname "$bl")")
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          echo "Toolchain en: $root"

      - name: Descargar CPython
        env:
          PYV: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          wget -q "https://www.python.org/ftp/python/${PYV}/Python-${PYV}.tgz" -O py.tgz
          tar -xf py.tgz
          mv "Python-${PYV}" cpython
          ls cpython | head -20

      - name: Instrumentar error de getpath
        run: |
          python3.12 - <<'PY'
          from pathlib import Path
          import subprocess

          source_path = Path("cpython/Modules/getpath.c")
          source = source_path.read_text()
          include = "#include <wchar.h>\n"
          needle = '        _PyErr_WriteUnraisableMsg("error evaluating path", NULL);'
          replacement = (
              "        PyObject *type = NULL;\n"
              "        PyObject *value = NULL;\n"
              "        PyObject *traceback = NULL;\n"
              "        PyErr_Fetch(&type, &value, &traceback);\n"
              "        PyObject *type_name = type ? PyObject_GetAttrString(type, \"__name__\") : NULL;\n"
              "        PyObject *message = value ? PyObject_Str(value) : NULL;\n"
              "        const char *type_text = type_name ? PyUnicode_AsUTF8(type_name) : NULL;\n"
              "        const char *message_text = message ? PyUnicode_AsUTF8(message) : NULL;\n"
              "        FILE *log = fopen(\"/data/renpy/getpath-error.log\", \"w\");\n"
              "        if (log) {\n"
              "            fprintf(log, \"getpath exception: %s: %s\\n\",\n"
              "                    type_text ? type_text : \"unknown\",\n"
              "                    message_text ? message_text : \"no exception text\");\n"
              "            fclose(log);\n"
              "        }\n"
              "        Py_XDECREF(type_name);\n"
              "        Py_XDECREF(message);\n"
              "        PyErr_Restore(type, value, traceback);\n"
              + needle + "\n"
          )
          if source.count(include) != 1 or source.count(needle) != 1:
              raise SystemExit("No pude identificar de forma unica el punto de error de getpath.c")
          source = source.replace(include, include + "#include <stdio.h>\n", 1)
          source_path.write_text(source.replace(needle, replacement, 1))

          import_path = Path("cpython/Python/import.c")
          import_source = import_path.read_text()
          import_include = "#include <stdbool.h>              // bool\n"
          import_needle = '        _PyErr_Print(tstate);\n        return _PyStatus_ERR("external importer setup failed");'
          import_capture = (
              "        PyObject *type = NULL;\n"
              "        PyObject *value = NULL;\n"
              "        PyObject *traceback = NULL;\n"
              "        PyErr_Fetch(&type, &value, &traceback);\n"
              "        PyObject *type_name = type ? PyObject_GetAttrString(type, \"__name__\") : NULL;\n"
              "        PyObject *message = value ? PyObject_Str(value) : NULL;\n"
              "        const char *type_text = type_name ? PyUnicode_AsUTF8(type_name) : NULL;\n"
              "        const char *message_text = message ? PyUnicode_AsUTF8(message) : NULL;\n"
              "        FILE *log = fopen(\"/data/renpy/import-error.log\", \"w\");\n"
              "        if (log) {\n"
              "            fprintf(log, \"importlib exception: %s: %s\\n\",\n"
              "                    type_text ? type_text : \"unknown\",\n"
              "                    message_text ? message_text : \"no exception text\");\n"
              "            fclose(log);\n"
              "        }\n"
              "        Py_XDECREF(type_name);\n"
              "        Py_XDECREF(message);\n"
              "        PyErr_Restore(type, value, traceback);\n"
          )
          if import_source.count(import_include) != 1 or import_source.count(import_needle) != 1:
              raise SystemExit("No pude identificar de forma unica el error de importlib esperado")
          import_source = import_source.replace(import_include, import_include + "#include <stdio.h>\n", 1)
          import_path.write_text(import_source.replace(import_needle, import_capture + import_needle, 1))

          thread_path = Path("cpython/Modules/_threadmodule.c")
          thread_source = thread_path.read_text()
          thread_include = '#include "structmember.h"         // PyMemberDef\n'
          thread_helper = (
              "static void renpy_log_rlock_stack(FILE *log)\n"
              "{\n"
              "    PyFrameObject *frame = PyThreadState_GetFrame(PyThreadState_Get());\n"
              "    int depth = 0;\n"
              "    while (frame && depth < 12) {\n"
              "        PyCodeObject *code = PyFrame_GetCode(frame);\n"
              "        PyObject *name = code ? PyObject_GetAttrString((PyObject *)code, \"co_name\") : NULL;\n"
              "        PyObject *filename = code ? PyObject_GetAttrString((PyObject *)code, \"co_filename\") : NULL;\n"
              "        const char *name_text = name ? PyUnicode_AsUTF8(name) : NULL;\n"
              "        const char *filename_text = filename ? PyUnicode_AsUTF8(filename) : NULL;\n"
              "        fprintf(log, \"frame[%d]: %s at %s:%d\\n\", depth,\n"
              "                name_text ? name_text : \"?\",\n"
              "                filename_text ? filename_text : \"?\",\n"
              "                PyFrame_GetLineNumber(frame));\n"
              "        Py_XDECREF(filename);\n"
              "        Py_XDECREF(name);\n"
              "        Py_XDECREF(code);\n"
              "        PyFrameObject *back = PyFrame_GetBack(frame);\n"
              "        Py_DECREF(frame);\n"
              "        frame = back;\n"
              "        depth++;\n"
              "    }\n"
              "}\n\n"
            )
          thread_needle = (
              "    if (self->rlock_count == 0 || self->rlock_owner != tid) {\n"
              "        PyErr_SetString(PyExc_RuntimeError,\n"
              "                        \"cannot release un-acquired lock\");"
          )
          thread_replacement = (
              "    if (self->rlock_count == 0 || self->rlock_owner != tid) {\n"
              "        FILE *log = fopen(\"/data/renpy/rlock-error.log\", \"w\");\n"
              "        if (log) {\n"
              "            fprintf(log, \"rlock mismatch: count=%lu owner=%lu current=%lu\\n\",\n"
              "                    self->rlock_count, self->rlock_owner, tid);\n"
              "            renpy_log_rlock_stack(log);\n"
              "            fclose(log);\n"
              "        }\n"
              "        PyErr_SetString(PyExc_RuntimeError,\n"
              "                        \"cannot release un-acquired lock\");"
          )
          if thread_source.count(thread_include) != 1 or thread_source.count(thread_needle) != 1:
              raise SystemExit("No pude identificar de forma unica el error de RLock esperado")
          thread_source = thread_source.replace(
              thread_include, thread_include + "#include <stdio.h>\n" + thread_helper, 1
          )
          thread_source = thread_source.replace(thread_needle, thread_replacement, 1)
          thread_save_needle = (
              "    if (self->rlock_count == 0) {\n"
              "        PyErr_SetString(PyExc_RuntimeError,\n"
              "                        \"cannot release un-acquired lock\");"
          )
          thread_save_replacement = (
              "    if (self->rlock_count == 0) {\n"
              "        FILE *log = fopen(\"/data/renpy/rlock-error.log\", \"w\");\n"
              "        if (log) {\n"
              "            fprintf(log, \"rlock release_save: count=%lu owner=%lu current=%lu\\n\",\n"
              "                    self->rlock_count, self->rlock_owner, PyThread_get_thread_ident());\n"
              "            renpy_log_rlock_stack(log);\n"
              "            fclose(log);\n"
              "        }\n"
              "        PyErr_SetString(PyExc_RuntimeError,\n"
              "                        \"cannot release un-acquired lock\");"
          )
          if thread_source.count(thread_save_needle) != 1:
              raise SystemExit("No pude identificar de forma unica el error de RLock release_save esperado")
          thread_path.write_text(thread_source.replace(thread_save_needle, thread_save_replacement, 1))

          unicode_path = Path("cpython/Objects/unicodeobject.c")
          unicode_source = unicode_path.read_text()
          unicode_include = '#include "Python.h"\n'
          unicode_needle = (
              "    PyObject *codec = _PyCodec_Lookup(encoding);\n"
              "    PyMem_RawFree(encoding);\n\n"
              "    if (!codec)\n"
              "        goto error;"
          )
          unicode_replacement = (
              "    PyObject *codec = _PyCodec_Lookup(encoding);\n"
              "    if (!codec) {\n"
              "        PyObject *type = NULL;\n"
              "        PyObject *value = NULL;\n"
              "        PyObject *traceback = NULL;\n"
              "        PyErr_Fetch(&type, &value, &traceback);\n"
              "        PyObject *type_name = type ? PyObject_GetAttrString(type, \"__name__\") : NULL;\n"
              "        PyObject *message = value ? PyObject_Str(value) : NULL;\n"
              "        PyObject *paths = PySys_GetObject(\"path\");\n"
              "        PyObject *paths_repr = paths ? PyObject_Repr(paths) : NULL;\n"
              "        const char *type_text = type_name ? PyUnicode_AsUTF8(type_name) : NULL;\n"
              "        const char *message_text = message ? PyUnicode_AsUTF8(message) : NULL;\n"
              "        const char *paths_text = paths_repr ? PyUnicode_AsUTF8(paths_repr) : NULL;\n"
              "        FILE *log = fopen(\"/data/renpy/fs-codec-error.log\", \"w\");\n"
              "        if (log) {\n"
              "            fprintf(log, \"encoding=%s exception=%s: %s\\n\", encoding,\n"
              "                    type_text ? type_text : \"unknown\",\n"
              "                    message_text ? message_text : \"no exception text\");\n"
              "            fprintf(log, \"sys.path=%s\\n\", paths_text ? paths_text : \"unavailable\");\n"
              "            fclose(log);\n"
              "        }\n"
              "        Py_XDECREF(paths_repr);\n"
              "        Py_XDECREF(message);\n"
              "        Py_XDECREF(type_name);\n"
              "        PyErr_Restore(type, value, traceback);\n"
              "        PyMem_RawFree(encoding);\n"
              "        goto error;\n"
              "    }\n"
              "    PyMem_RawFree(encoding);"
          )
          if unicode_source.count(unicode_include) != 1 or unicode_source.count(unicode_needle) != 1:
              raise SystemExit("No pude identificar de forma unica el codec lookup de filesystem")
          unicode_source = unicode_source.replace(unicode_include, unicode_include + "#include <stdio.h>\n", 1)
          unicode_path.write_text(unicode_source.replace(unicode_needle, unicode_replacement, 1))

          open_flag_patches = (
              ("cpython/Python/fileutils.c", "    flags |= O_CLOEXEC;\n"),
              ("cpython/Modules/posixmodule.c", "    flags |= O_CLOEXEC;\n"),
              ("cpython/Modules/_io/fileio.c", "    flags |= O_CLOEXEC;\n"),
          )
          for filename, needle in open_flag_patches:
              path = Path(filename)
              source = path.read_text()
              if source.count(needle) != 1:
                  raise SystemExit(f"No pude identificar de forma unica la flag O_CLOEXEC en {filename}")
              path.write_text(source.replace(needle, "", 1))

          freeze_path = Path("cpython/Tools/build/freeze_modules.py")
          freeze_source = freeze_path.read_text()
          freeze_entry = "        #'<encodings.*>',\n"
          if freeze_source.count(freeze_entry) != 1:
              raise SystemExit("No pude encontrar de forma unica la entrada encodings de freeze_modules.py")
          freeze_path.write_text(freeze_source.replace(freeze_entry, "        '<encodings.*>',\n", 1))
          subprocess.run(["python3.12", str(freeze_path), "--frozen-modules"], check=True)

          PY

      # struct stat de OpenOrbis (bits/stat.h) usa mode_t de 4 bytes y desplaza los campos 8 bytes respecto al kernel
      # de la PS4 (st_size leia st_blocks). Se sobreescribe con el layout real; $HOME/stubs va antes que $OO/include.
      # Ademas, get/set_inheritable de CPython usan fcntl(F_GETFD), sospechoso del EINVAL en open(): se anulan.
      - name: Parche stat e inheritable (PS4)
        run: |
          mkdir -p "$HOME/stubs/bits"
          cat > "$HOME/stubs/bits/stat.h" <<'EOF'
          #include <stdint.h>
          struct stat {
              uint32_t st_dev;
              uint32_t st_ino;
              uint16_t st_mode;
              uint16_t st_nlink;
              uint32_t st_uid;
              uint32_t st_gid;
              uint32_t st_rdev;
              struct timespec st_atim;
              struct timespec st_mtim;
              struct timespec st_ctim;
              int64_t  st_size;
              int64_t  st_blocks;
              uint32_t st_blksize;
              uint32_t st_flags;
              uint32_t st_gen;
              int32_t  st_lspare;
              struct timespec st_birthtim;
          };
          EOF
          # HACL* (md5/sha1/sha2/sha3) hace #include <sys/endian.h> en la rama __FreeBSD__ y OpenOrbis solo trae
          # <endian.h> (estilo musl, con htobe*/le*toh incluidos). Se redirige.
          mkdir -p "$HOME/stubs/sys"
          cat > "$HOME/stubs/sys/endian.h" <<'EOF'
          #pragma once
          #include <endian.h>
          EOF
          python3.12 - <<'PY'
          from pathlib import Path
          p = Path("cpython/Python/fileutils.c")
          s = p.read_text()
          sigs = {
              "static int\nget_inheritable(int fd, int raise)\n{\n":
                  "    (void)fd; (void)raise;\n    return 0;\n",
              "static int\nset_inheritable(int fd, int inheritable, int raise, int *atomic_flag_works)\n{\n":
                  "    (void)fd; (void)inheritable; (void)raise; (void)atomic_flag_works;\n    return 0;\n",
          }
          for sig, body in sigs.items():
              if s.count(sig) != 1:
                  raise SystemExit("No encuentro de forma unica: " + sig)
              s = s.replace(sig, sig + body, 1)
          p.write_text(s)
          PY

      # Compilador "envoltorio": configure necesita compilar Y enlazar ejecutables de prueba.
      # Con -c/-E/-S solo compila; en cualquier otro caso anade el script de enlace y crt1.o de OpenOrbis.
      - name: Crear compilador envoltorio (orbis-cc)
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/orbis-cc" <<'EOF'
          #!/bin/bash
          OO="$OO_PS4_TOOLCHAIN"
          base=(clang --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -fshort-wchar -isysroot "$OO" -include "$HOME/stubs/ps4_compat.h" -isystem "$HOME/stubs" -isystem "$OO/include")
          only_compile=0
          for a in "$@"; do
            case "$a" in
              -c|-E|-S|-M|-MM|-v|-V|--version|-qversion|-print-*|-dumpmachine|-dumpversion) only_compile=1 ;;
            esac
          done
          if [ "$only_compile" = 1 ]; then exec "${base[@]}" "$@"; fi
          exec "${base[@]}" -fuse-ld=lld -nostdlib -Wl,-m,elf_x86_64 -Wl,-pie -Wl,--script,"$OO/link.x" \
            -Wl,--eh-frame-hdr -L"$OO/lib" "$@" -lc -lkernel "$OO/lib/crt1.o"
          EOF
          sed -i 's/^          //' "$HOME/bin/orbis-cc"
          chmod +x "$HOME/bin/orbis-cc"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # CPython cree que es FreeBSD (__FreeBSD__) y pide pthread_np.h, que OpenOrbis no trae.
          mkdir -p "$HOME/stubs"
          cat > "$HOME/stubs/pthread_np.h" <<'EOF'
          #pragma once
          #include <pthread.h>
          #include <stdint.h>
          static inline int pthread_getthreadid_np(void) { return (int)(intptr_t)pthread_self(); }
          EOF
          # closefrom(): CPython lo usa en _Py_closerange (rama __FreeBSD__) y la libc de OpenOrbis no lo declara.
          cat > "$HOME/stubs/ps4_compat.h" <<'EOF'
          #pragma once
          extern int close(int);
          static inline void closefrom(int lowfd) { for (int fd = lowfd; fd < 256; fd++) close(fd); }
          EOF
          # sys/sysctl.h: posixmodule.c lo incluye (rama __FreeBSD__) y OpenOrbis no lo trae.
          mkdir -p "$HOME/stubs/sys"
          cat > "$HOME/stubs/sys/sysctl.h" <<'EOF'
          #pragma once
          #include <stddef.h>
          int sysctl(const int *name, unsigned int namelen, void *oldp, size_t *oldlenp, const void *newp, size_t newlen);
          EOF

      # d_ino: la libc de OpenOrbis no expone d_ino en struct dirent (dirent.h solo trae "#define d_fileno d_ino").
      # posixmodule.c lo usa UNA vez (DirEntry.inode()). Se sustituye por 0 en el codigo fuente: el numero de inodo
      # de las entradas de directorio no hace falta para Ren'Py. Se vuelca en dirent.txt donde se define struct dirent.
      - name: Parche dirent (d_ino)
        run: |
          mkdir -p logs-python
          { grep -rnE 'struct dirent *\{|d_fileno|d_ino' "$OO_PS4_TOOLCHAIN/include" | head -20; } 2>&1 | tee logs-python/dirent.txt || true
          grep -n 'direntp->d_ino' cpython/Modules/posixmodule.c | tee -a logs-python/dirent.txt
          sed -i 's/direntp->d_ino/0/g' cpython/Modules/posixmodule.c
          echo "Tras el parche: $(grep -c 'direntp->d_ino' cpython/Modules/posixmodule.c) usos restantes" | tee -a logs-python/dirent.txt

      # zlib estatica: CPython la necesita para el modulo zlib (Ren'Py la usa en .rpa y guardados).
      # Se compilan solo los ficheros de compresion (sin gz*, que pide funciones de fichero extra).
      # Los .o se fusionan despues dentro de libpython3.12.a para que el PKG no necesite -lz.
      - name: Compilar zlib estatica
        run: |
          set -euo pipefail
          Z=1.3.1
          ok=0
          for u in "https://github.com/madler/zlib/releases/download/v${Z}/zlib-${Z}.tar.gz" \
                   "https://zlib.net/zlib-${Z}.tar.gz"; do
            if wget -q "$u" -O zlib.tgz; then ok=1; echo "Descargado: $u"; break; fi
          done
          [ "$ok" = 1 ] || { echo "::error::No pude descargar zlib"; exit 1; }
          tar -xf zlib.tgz
          mkdir -p "$HOME/zlib/include" "$HOME/zlib/obj"
          cd "zlib-${Z}"
          for f in adler32 compress crc32 deflate infback inffast inflate inftrees trees uncompr zutil; do
            orbis-cc -O2 -DHAVE_UNISTD_H -c "$f.c" -o "$HOME/zlib/obj/$f.o"
          done
          llvm-ar rcs "$HOME/zlib/libz.a" "$HOME/zlib/obj/"*.o
          cp zlib.h zconf.h "$HOME/zlib/include/"
          ls -l "$HOME/zlib/libz.a" | tee "$GITHUB_WORKSPACE/logs-python/zlib.txt"

      # Valores que configure no puede averiguar al cross-compilar (no puede ejecutar nada de la PS4).
      - name: config.site
        run: |
          cat > "$HOME/config.site" <<'EOF'
          ac_cv_file__dev_ptmx=no
          ac_cv_file__dev_ptc=no
          ac_cv_buggy_getaddrinfo=no
          ac_cv_func_dlopen=no
          ac_cv_lib_dl_dlopen=no
          ac_cv_have_long_long_format=yes
          ac_cv_working_tzset=yes
          ac_cv_pthread_is_default=yes
          ac_cv_computed_gotos=yes
          ac_cv_header_stropts_h=no
          ac_cv_func_chflags=no
          ac_cv_func_lchflags=no
          EOF
          sed -i 's/^          //' "$HOME/config.site"

      # TRUCO: el configure de CPython rechaza hosts desconocidos al cross-compilar (error "cross build not supported").
      # Se declara un host con triple Linux distinto del build para forzar modo cross. Es un apaño: el reconocimiento
      # dira si algun supuesto de Linux estorba. El compilador real sigue apuntando a freebsd12-elf (orbis-cc).
      - name: configure
        run: |
          set -o pipefail
          mkdir -p build && cd build
          export CONFIG_SITE="$HOME/config.site"
          ../cpython/configure \
            --build=x86_64-build-linux-gnu \
            --host=x86_64-pc-linux-gnu \
            --with-build-python="$(command -v python3.12)" \
            --disable-shared --disable-ipv6 --disable-test-modules \
            --without-ensurepip --without-doc-strings \
            --prefix=/usr/local \
            CC=orbis-cc CPP="orbis-cc -E" AR=llvm-ar RANLIB=llvm-ranlib READELF=llvm-readelf \
            CFLAGS="-O2 -DHAVE_BROKEN_POSIX_SEMAPHORES" 2>&1 | tee "$GITHUB_WORKSPACE/logs-python/configure.log"

      - name: Configurar módulos builtin
        run: |
          mkdir -p build/Modules build/Modules/_hacl build/Modules/_blake2 build/Modules/_sha3
          cat > build/Modules/Setup.local <<'EOF'
          *static*
          _asyncio _asynciomodule.c
          _bisect _bisectmodule.c
          _contextvars _contextvarsmodule.c
          _csv _csv.c
          _datetime _datetimemodule.c
          _heapq _heapqmodule.c
          _json _json.c
          _opcode _opcode.c
          _pickle _pickle.c
          _queue _queuemodule.c
          _random _randommodule.c
          _statistics _statisticsmodule.c
          _struct _struct.c
          _zoneinfo _zoneinfo.c
          array arraymodule.c
          binascii binascii.c -UUSE_ZLIB_CRC32
          cmath cmathmodule.c
          math mathmodule.c
          select selectmodule.c
          unicodedata unicodedata.c
          _md5 md5module.c -I$(srcdir)/Modules/_hacl/include _hacl/Hacl_Hash_MD5.c -D_BSD_SOURCE -D_DEFAULT_SOURCE
          _sha1 sha1module.c -I$(srcdir)/Modules/_hacl/include _hacl/Hacl_Hash_SHA1.c -D_BSD_SOURCE -D_DEFAULT_SOURCE
          _sha2 sha2module.c -I$(srcdir)/Modules/_hacl/include _hacl/Hacl_Hash_SHA2.c -D_BSD_SOURCE -D_DEFAULT_SOURCE
          _sha3 sha3module.c -I$(srcdir)/Modules/_hacl/include _hacl/Hacl_Hash_SHA3.c -D_BSD_SOURCE -D_DEFAULT_SOURCE
          _blake2 _blake2/blake2module.c _blake2/blake2b_impl.c _blake2/blake2s_impl.c
          EOF
          echo "zlib zlibmodule.c -I$HOME/zlib/include -DHAVE_ZLIB_COPY" >> build/Modules/Setup.local
          if [ "${{ inputs.socket }}" = "true" ]; then
            echo "_socket socketmodule.c" >> build/Modules/Setup.local
          fi
          cp build/Modules/Setup.local logs-python/modules-setup.txt

      - name: Compilar libpython (solo la libreria estatica)
        run: |
          cd build
          set +e
          make -k -j"${{ inputs.jobs }}" libpython3.12.a 2>&1 | tee "$GITHUB_WORKSPACE/logs-python/make.log"
          echo "make rc=${PIPESTATUS[0]}" | tee -a "$GITHUB_WORKSPACE/logs-python/make.log"
          if [ -f libpython3.12.a ]; then llvm-ar rcs libpython3.12.a "$HOME"/zlib/obj/*.o; fi
          mkdir -p "$GITHUB_WORKSPACE/dist-python"
          cp libpython3*.a "$GITHUB_WORKSPACE/dist-python/" 2>/dev/null || true
          [ -f libpython3.12.a ] || { echo "::error::No se genero libpython3.12.a. Mira logs-python/make.log"; exit 1; }

      - name: Preparar biblioteca estandar para la prueba
        run: |
          set -euo pipefail
          mkdir -p dist-python
          (cd cpython/Lib && zip -0 -q -r "$GITHUB_WORKSPACE/dist-python/python312.zip" . \
            -x 'test/*' '*/test/*' '*/tests/*' 'idlelib/*' 'tkinter/*' 'turtledemo/*' 'ensurepip/*' 'lib2to3/*' '*/__pycache__/*')

      - name: Construir PKG de prueba Python
        run: |
          set -euo pipefail
          cp build/libpython3.12.a "$OO_PS4_TOOLCHAIN/lib/"
          samples="$RUNNER_TEMP/python-smoke-samples"
          rm -rf "$samples"
          cp -r "$OO_PS4_TOOLCHAIN/samples" "$samples"
          work="$samples/renpyps4"
          mkdir -p "$work/renpyps4" "$work/assets"
          cp "$samples/SDL2/Makefile" "$work/Makefile"
          cp -r "$samples/SDL2/sce_sys" "$work/sce_sys"
          cp -r "$samples/SDL2/sce_module" "$work/sce_module"
          rm -f "$work/sce_sys/param.sfo"
          cp app/python_smoke.cpp "$work/renpyps4/main.cpp"
          cp dist-python/python312.zip "$work/assets/stdlib.zip"
          sed -i -E \
            -e 's/^TITLE +:=.*/TITLE       := RenPy Python Smoke Test/' \
            -e 's/^TITLE_ID +:=.*/TITLE_ID    := RENP00001/' \
            -e 's/^CONTENT_ID +:=.*/CONTENT_ID  := IV0000-RENP00001_00-RENPYPS4TEST0000/' \
            -e 's/^COMMONFILES +:=.*/COMMONFILES :=/' \
            -e 's|^ASSETS.*|ASSETS      := assets/stdlib.zip|' \
            -e 's/^(LIBS +:=)/\1 -lpython3.12 -lm/' \
            -e '/^CXXFLAGS[[:space:]]*:=/a CXXFLAGS += -fshort-wchar -I'"$GITHUB_WORKSPACE"'/cpython/Include -I'"$GITHUB_WORKSPACE"'/build' \
            "$work/Makefile"
          mkdir -p "$GITHUB_WORKSPACE/dist-python-smoke"
          cd "$work"
          set +e
          make 2>&1 | tee "$GITHUB_WORKSPACE/logs-python/smoke-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || { echo "::error::No se pudo construir el PKG de prueba Python"; exit "$rc"; }
          find . -name '*.pkg' -exec cp {} "$GITHUB_WORKSPACE/dist-python-smoke/" \;
          [ -n "$(find "$GITHUB_WORKSPACE/dist-python-smoke" -name '*.pkg' -print -quit)" ] || { echo "::error::No se genero el PKG de prueba Python"; exit 1; }

      - name: Resumen de lo que falta en la libc
        if: always()
        run: |
          cp build/config.log logs-python/config.log 2>/dev/null || true
          grep -E '\.\.\. no$' logs-python/configure.log > logs-python/missing.txt 2>/dev/null || true
          grep -E 'error:|undefined (symbol|reference)' logs-python/make.log | sort | uniq -c | sort -rn | head -60 > logs-python/errores-make.txt 2>/dev/null || true
          {
            echo '### CPython PS4'
            echo "Funciones/cabeceras no encontradas: $(wc -l < logs-python/missing.txt 2>/dev/null || echo 0)"
            ls -l dist-python 2>/dev/null || echo "(sin libpython)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-python
          path: logs-python
          if-no-files-found: ignore

      - name: Subir libpython
        if: always() && hashFiles('dist-python/libpython3.12.a') != ''
        uses: actions/upload-artifact@v4
        with:
          name: python-ps4
          path: dist-python
          if-no-files-found: error

      - name: Subir PKG de prueba Python
        if: always() && hashFiles('dist-python-smoke/*.pkg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: python-ps4-smoke
          path: dist-python-smoke
          if-no-files-found: error
